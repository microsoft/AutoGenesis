name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - feature/agent-integration
  push:
    branches:
      - feature/agent-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compile Python sources
        run: >-
          python3 -m compileall -q
          appium-mcp-server
          pywinauto-mcp-server
          behave-demo

  extension-build:
    name: Extension build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install extension dependencies
        working-directory: bdd_ai_toolkit
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Compile extension and packaged resources
        working-directory: bdd_ai_toolkit
        run: npm run compile
      - name: Parse GitHub YAML configuration
        working-directory: bdd_ai_toolkit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const yaml = require('js-yaml');
          const root = path.resolve('..', '.github');
          const visit = directory => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(file);
              else if (/\.ya?ml$/i.test(entry.name)) yaml.load(fs.readFileSync(file, 'utf8'));
            }
          };
          visit(root);
          NODE

  documentation-build:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - name: Install documentation dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Build documentation
        working-directory: docs
        run: pnpm run build
